<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada Validada</title>

    <style>
        :root {
            /* Rojo terciopelo para las cortinas */
            --rojo-cortina: #800000; 
            --rojo-brillo: #a4161a;
            --color-texto: #f5f3f0;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #050505; /* Negro casi total para resaltar la pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: var(--color-texto);
        }

        /* PANTALLA DE CINE */
        .pantalla {
            position: relative;
            width: 85vw;
            max-width: 650px;
            height: 380px;
            background: #1a1a1a;
            border-radius: 5px; /* Bordes menos redondeados para que parezca pantalla real */
            box-shadow: 0 0 100px rgba(164, 22, 26, 0.2); /* Brillo tenue rojo en la sala */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            border: 4px solid #222;
        }

        /* CONTENIDO */
        .contenido {
            opacity: 0;
            animation: aparecer 1.5s ease forwards;
            animation-delay: 2.2s;
            padding: 20px;
            z-index: 2;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
            line-height: 1.5;
        }

        /* CORTINAS CON TEXTURA */
        .cortina {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            /* Efecto de pliegues de terciopelo */
            background: repeating-linear-gradient(
                to right,
                var(--rojo-cortina),
                var(--rojo-cortina) 10%,
                var(--rojo-brillo) 15%,
                var(--rojo-cortina) 20%
            );
            z-index: 5;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .izquierda {
            left: 0;
            border-right: 2px solid rgba(0,0,0,0.3);
            animation: abrirIzq 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }

        .derecha {
            right: 0;
            border-left: 2px solid rgba(0,0,0,0.3);
            animation: abrirDer 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }

        @keyframes abrirIzq {
            to { transform: translateX(-95%); } /* No desaparece del todo para que se vea el borde */
        }

        @keyframes abrirDer {
            to { transform: translateX(95%); }
        }

        /* EFECTO PROYECTOR REALISTA */
        .proyector {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 220, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 3;
            animation: parpadeoProyector 0.2s infinite;
        }

        @keyframes parpadeoProyector {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="sonidoProyector">
        <source src="proyector.mp3" type="audio/mpeg">
    </audio>

    <div class="pantalla">
        <div class="proyector"></div>

        <div class="cortina izquierda"></div>
        <div class="cortina derecha"></div>

        <div class="contenido">
            <h1>🎬 Entrada Validada</h1>
            <p>Tu cita con Rodrigo está confirmada 🍿</p>
            <p style="font-style: italic; font-size: 1rem;">Prepárate para una buena película 😉</p>
        </div>
    </div>

    <script>
        window.addEventListener("load", () => {

const sonido = document.getElementById("sonidoProyector");

sonido.volume = 0.5;

/* intentar autoplay */
sonido.play().catch(() => {
    console.log("Autoplay bloqueado");
});

/* si el navegador lo bloquea, se reproduce al tocar pantalla */
document.addEventListener("click", () => {
    sonido.play();
});

});
    </script>
</body>
</html>
