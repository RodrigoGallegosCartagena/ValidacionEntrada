<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una invitación especial 🎬</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            /* Rojo borgoña profundo y elegante */
            --color-cine: #5e0b0e; 
            /* Dorado bronce para mensajes de éxito */
            --color-dorado-suave: #8e7d55;
            --color-fondo: #f5f3f0;
            --color-texto: #2b2b2b;
            --color-ticket: #fff9e6; 
        }

        body {
            margin: 0;
            padding: 0;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #fcfaf7 0%, #e2ddd9 100%);
            font-family: 'Inter', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* --- PREGUNTA ESTILIZADA --- */
        h2 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--color-cine);
            line-height: 1.4;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            text-shadow: none; /* Limpio y elegante */
        }

        .container {
            display: none;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            width: 85%;
            max-width: 340px;
            z-index: 2;
            animation: fadeIn .6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .botones {
            margin-top: 20px;
            position: relative;
            height: 160px;
            width: 100%;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
            transition: all 0.2s ease;
        }

        #si {
            background: var(--color-cine);
            color: #fdfdfd;
            top: 40%;
            left: 10%;
            box-shadow: 0 6px 20px rgba(94, 11, 14, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #no {
            background: #eee;
            color: #777;
            top: 40%;
            right: 10%;
        }

        /* --- TICKET VINTAGE --- */
        #ticket {
            display: none;
            position: relative;
            margin: 20px auto 0;
            width: 280px;
            background: var(--color-ticket);
            padding: 25px 20px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border-radius: 4px;
            border: 1px solid #e6d5b8;
            animation: ticketAnim .8s cubic-bezier(.175,.885,.32,1.275);
        }

        #ticket::before, #ticket::after {
            content: "";
            position: absolute;
            width: 26px;
            height: 26px;
            background: #ffffff; 
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
        }
        #ticket::before { left: -14px; }
        #ticket::after { right: -14px; }

        @keyframes ticketAnim {
            0% { transform: scale(.3) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .ticket-header {
            border-bottom: 2px dashed #d1c1a5;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .ticket-header h3 {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--color-dorado-suave);
            margin: 0;
            text-transform: uppercase;
        }

        .ticket-body { text-align: left; }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .label {
            font-size: 0.6rem;
            color: #b5a48b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 0.9rem;
            color: #3d3422;
            font-weight: 600;
        }

        /* --- MENSAJE DE ÉXITO --- */
        #mensaje {
            margin-top: 25px;
            font-size: 1.05rem;
            color: var(--color-dorado-suave);
            font-weight: 600;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .qr-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 15px auto 5px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1c1a5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CLAQUETA */
        .clapper-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeOut .8s ease forwards 2.5s;
            z-index: 100;
        }
        .clapper { width:140px; height:90px; background:#222; border-radius:10px; position:relative; }
        .top { width:140px; height:25px; background:repeating-linear-gradient(45deg,white,white 15px,black 15px,black 30px); position:absolute; top:-12px; left:0; transform-origin:left bottom; animation:clap .8s ease infinite; border-radius:5px; }
        @keyframes clap { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-35deg)} }
        @keyframes fadeOut { to{opacity:0; visibility:hidden} }

        /* PALOMITAS */
        .popcorn { position:absolute; font-size:25px; z-index:1; animation:caer linear infinite; pointer-events:none; }
        @keyframes caer { 0%{transform:translateY(-10vh)} 100%{transform:translateY(110vh)} }
    </style>
</head>

<body>

<div class="clapper-container" id="claqueta">
    <div class="clapper"><div class="top"></div></div>
    <p style="color:#555; font-weight:bold; margin-top:15px;">Preparando el estreno... 🎬</p>
</div>

<div class="container" id="contenido">
    <h2 id="titulo">Angie Tatiana Garcia Porras,<br>¿Me darías el honor de una tarde de cine? 🎬🍿</h2>

    <div class="botones" id="areaBotones">
        <button id="si" onclick="aceptar()">Por supuesto</button>
        <button id="no">No</button>
    </div>

    <div id="ticket">
        <div class="ticket-header">
            <h3>Cinema Ticket</h3>
        </div>
        
        <div class="ticket-body">
            <div class="ticket-row">
                <div>
                    <div class="label">Película</div>
                    <div class="value">Nuestra Historia Juntos</div>
                </div>
                <div style="text-align: right;">
                    <div class="label">Asiento</div>
                    <div class="value">VIP / Juntos x siempre</div>
                </div>
            </div>
            
            <div class="ticket-row">
                <div>
                    <div class="label">Invitada</div>
                    <div class="value">Angie Tatiana Garcia Porras</div>
                </div>
                <div style="text-align: right;">
                    <div class="label">Anfitrión</div>
                    <div class="value">Rodrigo Eduardo Gallegos Cartagena</div>
                </div>
            </div>
        </div>

        <div class="qr-container">
            <div id="qr"></div>
        </div>
        <p style="font-size:.6rem; color:#7a6a4d; margin:0; letter-spacing:1px; font-weight: bold;">ESCANEAME PARA CONFIRMAR </p>
    </div>

    <div id="mensaje"></div>

    <audio id="sonidoDing">
        <source src="ding.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    setTimeout(() => {
        document.getElementById("claqueta").style.display = "none";
        document.getElementById("contenido").style.display = "block";
        iniciarPalomitas();
    }, 3200);

    const botonNo = document.getElementById("no");
    function moverBoton() {
        const x = Math.random() * (window.innerWidth - botonNo.offsetWidth);
        const y = Math.random() * (window.innerHeight - botonNo.offsetHeight);
        botonNo.style.position = "fixed";
        botonNo.style.left = x + "px";
        botonNo.style.top = y + "px";
        botonNo.style.zIndex = "999"; 
    }
    botonNo.addEventListener("mouseover", moverBoton);
    botonNo.addEventListener("touchstart", (e) => { e.preventDefault(); moverBoton(); });

    function aceptar() {
        const sonido = document.getElementById("sonidoDing");
        if(sonido) sonido.play();

        document.getElementById("titulo").style.display = "none";
        document.getElementById("areaBotones").style.display = "none";

        // Mensaje más literario y con color dorado suave aplicado vía CSS
        document.getElementById("mensaje").innerHTML = "Una excelente elección, Angie. 😌🍿<br>Nuestro estreno está oficialmente programado.";
        
        const ticket = document.getElementById("ticket");
        ticket.style.display = "block";

        setTimeout(() => {
            generarQR();
        }, 200);
    }

    function generarQR() {
        const qrDiv = document.getElementById("qr");
        qrDiv.innerHTML = "";
        new QRCode(qrDiv, {
            text: "https://rodrigogallegoscartagena.github.io/ValidacionEntrada/",
            width: 100,
            height: 100,
            colorDark: "#3d3422", 
            colorLight: "#fff9e6", 
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function iniciarPalomitas() {
        setInterval(() => {
            const p = document.createElement("div");
            p.classList.add("popcorn");
            p.innerHTML = "🍿";
            p.style.left = Math.random() * 100 + "vw";
            p.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 4000);
        }, 600);
    }
</script>

</body>
</html>
